<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Khách Mời Xác Nhận - Wedding</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldDeep: '#064e3b',
                        gold: '#d97706',
                        champagne: '#fef3c7'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 min-h-screen py-10 px-4">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div
            class="flex flex-col md:flex-row justify-between items-center mb-8 bg-emeraldDeep p-6 rounded-2xl shadow-lg text-white">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">Danh Sách Khách Xác Nhận Tham Dự</h1>
                <p class="text-xs md:text-sm text-gray-200 mt-1">Thống kê toàn bộ phản hồi từ khách mời cho ngày trọng
                    đại</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-4">
                <div class="bg-white/10 px-4 py-2 rounded-xl text-center">
                    <span class="block text-xs uppercase tracking-wider text-champagne">Tổng Khách Đi</span>
                    <span id="totalGuestsCount" class="text-xl font-bold">0</span>
                </div>
                <button onclick="fetchGuestList()"
                    class="bg-gold hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2">
                    <i class="fas fa-rotate"></i> Làm mới
                </button>
            </div>
        </div>

        <!-- Bảng danh sách -->
        <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-emeraldDeep/10 text-emeraldDeep text-xs uppercase tracking-wider font-bold">
                            <th class="p-4">Họ và Tên</th>
                            <th class="p-4">Số Điện Thoại</th>
                            <th class="p-4">Trạng Thái</th>
                            <th class="p-4 text-center">Số Người Đi Cùng</th>
                            <th class="p-4">Phương Tiện & Điểm Đón</th>
                            <th class="p-4">Lời Chúc / Yêu Cầu</th>
                            <th class="p-4">Thời Gian</th>
                        </tr>
                    </thead>
                    <tbody id="guestTableBody" class="divide-y divide-gray-100 text-sm text-gray-700">
                        <!-- Dữ liệu sẽ được render tự động bằng Javascript ở đây -->
                        <tr>
                            <td colspan="7" class="p-6 text-center text-gray-400">Đang tải dữ liệu...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script xử lý gọi API và đổ dữ liệu -->
    <script>
        async function fetchGuestList() {
            const tbody = document.getElementById('guestTableBody');
            const totalCountEl = document.getElementById('totalGuestsCount');
            tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i>Đang tải dữ liệu...</td></tr>`;

            try {
                // Gọi API backend của bạn để lấy danh sách
                const response = await fetch('https://uat1.akadigital.net/api/rsvp-list'); // Thay URL API thực tế của bạn
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = '';
                    let totalAttendingPeople = 0;

                    result.data.forEach(guest => {
                        // Tính tổng số người đi (chỉ tính những ai chọn yes)
                        if (guest.attendance === 'yes') {
                            totalAttendingPeople += (guest.guest_count || 1);
                        }

                        const statusBadge = guest.attendance === 'yes'
                            ? `<span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold">Sẽ tham dự</span>`
                            : `<span class="px-3 py-1 bg-red-100 text-red-700 rounded-full text-xs font-semibold">Không thể đến</span>`;

                        const row = `
                            <tr class="hover:bg-gray-50/80 transition">
                                <td class="p-4 font-semibold text-gray-900">${escapeHtml(guest.guest_name)}</td>
                                <td class="p-4 text-gray-600">${escapeHtml(guest.phone)}</td>
                                <td class="p-4">${statusBadge}</td>
                                <td class="p-4 text-center font-bold text-emeraldDeep">${guest.guest_count}</td>
                                <td class="p-4 text-xs">
                                    <span class="font-semibold text-gray-800 uppercase">${escapeHtml(guest.transport_method)}</span><br>
                                    <span class="text-gray-500">${escapeHtml(guest.pickup_location || 'N/A')}</span>
                                </td>
                                <td class="p-4 text-gray-600 italic max-w-xs truncate">${escapeHtml(guest.note || 'Không có')}</td>
                                <td class="p-4 text-xs text-gray-400">${new Date(guest.created_at).toLocaleString('vi-VN')}</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });

                    totalCountEl.innerText = totalAttendingPeople;
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400">Chưa có lời phản hồi nào được ghi nhận.</td></tr>`;
                    totalCountEl.innerText = '0';
                }
            } catch (error) {
                console.error('Error fetching guest list:', error);
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-500">Lỗi kết nối đến máy chủ không thể tải dữ liệu.</td></tr>`;
            }
        }

        // Hàm chống XSS cơ bản
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Tự động tải khi mở trang
        document.addEventListener('DOMContentLoaded', fetchGuestList);
    </script>
</body>

</html>
