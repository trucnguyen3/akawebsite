<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Khách Mời - SkyPremium Wedding</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        themeBg: '#e8d6e2',
                        themePrimary: '#583f52', // Tông màu tối/ấm làm điểm nhấn chữ và header
                        accentGold: '#b45309'
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>

<body class="min-h-screen py-12 px-4 text-gray-800 relative" style="background-color: #e8d6e2;">

    <div class="max-w-6xl mx-auto relative z-10">
        <!-- Header Brand -->
        <div class="text-center mb-10">
            <span class="text-amber-900 uppercase tracking-widest text-xs font-semibold">Quản Lý Phản Hồi Khách
                Mời</span>
            <h1 class="font-serif text-3xl md:text-5xl text-amber-950 mt-2">Danh Sách Tham Dự</h1>
            <p class="text-gray-700 text-sm mt-2">Thống kê toàn bộ thông tin xác nhận và phương tiện di chuyển</p>
        </div>

        <!-- Stats & Actions Bar -->
        <div
            class="glass-card p-6 rounded-3xl shadow-xl mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div
                    class="w-12 h-12 rounded-2xl bg-amber-900/10 flex items-center justify-center text-amber-900 text-xl font-bold">
                    <i class="fas fa-users"></i>
                </div>
                <div>
                    <span class="text-xs uppercase tracking-wider text-gray-600 font-bold block">Tổng Khách Tham
                        Dự</span>
                    <span id="totalGuestsCount" class="text-2xl font-bold text-amber-950">0</span>
                </div>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <input type="text" id="searchInput" onkeyup="filterGuests()" placeholder="Tìm kiếm theo tên hoặc SĐT..."
                    class="px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-amber-700 text-sm w-full md:w-64 bg-white">
                <button onclick="fetchGuestList()"
                    class="bg-[#e8d6e2] hover:bg-[#dfc8d8] text-[#4a3043] border border-[#d4b8cc] px-6 py-3 rounded-xl font-bold text-sm transition-all shadow-sm">
                    <i class="fas fa-rotate"></i> Làm mới
                </button>
            </div>
        </div>

        <!-- Data Table Card -->
        <div class="glass-card rounded-3xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-amber-900 text-amber-50 text-xs uppercase tracking-wider font-bold">
                            <th class="p-4">Họ và Tên</th>
                            <th class="p-4">Số Điện Thoại</th>
                            <th class="p-4">Xác Nhận</th>
                            <th class="p-4 text-center">Số Người</th>
                            <th class="p-4">Phương Tiện & Điểm Đón</th>
                            <th class="p-4">Lời Chúc / Ghi Chú</th>
                            <th class="p-4">Thời Gian</th>
                        </tr>
                    </thead>
                    <tbody id="guestTableBody" class="divide-y divide-gray-200/60 text-sm text-gray-800">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-gray-600 font-medium">
                                <i class="fas fa-spinner fa-spin mr-2"></i>Đang tải dữ liệu hệ thống...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script xử lý gọi API và render -->
    <script>
        let allGuests = [];

        async function fetchGuestList() {
            const tbody = document.getElementById('guestTableBody');
            const totalCountEl = document.getElementById('totalGuestsCount');
            tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-600"><i class="fas fa-spinner fa-spin mr-2"></i>Đang tải dữ liệu...</td></tr>`;

            try {
                // Đổi URL này thành API lấy danh sách của bạn
                const response = await fetch('https://uat1.akadigital.net/api/rsvp-list');
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    allGuests = result.data;
                    renderTable(allGuests);
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-600">Chưa có phản hồi nào từ khách mời.</td></tr>`;
                    totalCountEl.innerText = '0';
                }
            } catch (error) {
                console.error('Error fetching guest list:', error);
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-700 font-medium">Không thể kết nối đến máy chủ cơ sở dữ liệu.</td></tr>`;
            }
        }

        function renderTable(guests) {
            const tbody = document.getElementById('guestTableBody');
            const totalCountEl = document.getElementById('totalGuestsCount');
            tbody.innerHTML = '';
            let totalAttendingPeople = 0;

            guests.forEach(guest => {
                if (guest.attendance === 'yes') {
                    totalAttendingPeople += (guest.guest_count || 1);
                }

                const statusBadge = guest.attendance === 'yes'
                    ? `<span class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold">Tham dự</span>`
                    : `<span class="px-3 py-1 bg-rose-100 text-rose-800 rounded-full text-xs font-bold">Không thể đến</span>`;

                const row = `
                    <tr class="hover:bg-white/50 transition">
                        <td class="p-4 font-bold text-amber-950">${escapeHtml(guest.guest_name)}</td>
                        <td class="p-4 text-gray-700 font-mono">${escapeHtml(guest.phone)}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-center font-bold text-amber-900">${guest.guest_count}</td>
                        <td class="p-4 text-xs">
                            <span class="font-bold uppercase text-amber-900">${escapeHtml(guest.transport_method)}</span><br>
                            <span class="text-gray-600">${escapeHtml(guest.pickup_location || 'N/A')}</span>
                        </td>
                        <td class="p-4 text-gray-700 italic max-w-xs truncate">${escapeHtml(guest.note || 'Không có')}</td>
                        <td class="p-4 text-xs text-gray-500">${new Date(guest.created_at).toLocaleString('vi-VN')}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            totalCountEl.innerText = totalAttendingPeople;
        }

        function filterGuests() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allGuests.filter(g =>
                g.guest_name.toLowerCase().includes(keyword) || g.phone.toLowerCase().includes(keyword)
            );
            renderTable(filtered);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', fetchGuestList);
    </script>
</body>

</html>
